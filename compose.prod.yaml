services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudstorage
      POSTGRES_USER: cloud_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud_user -d cloudstorage"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    image: ghcr.io/narimangus/cloudstorage:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloudstorage
      SPRING_DATASOURCE_USERNAME: cloud_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - storage_data:/app/storage

volumes:
  postgres_data:
  storage_data:
