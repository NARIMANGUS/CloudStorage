name: CloudStorage CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudstorage-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cloudstorage
          POSTGRES_USER: cloud_user
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U cloud_user -d cloudstorage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize test database
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U cloud_user -d cloudstorage < db/init.sql

      - name: Build and test
        env:
          SPRING_DATASOURCE_PASSWORD: ci_password
        run: ./mvnw -B clean package

      - name: Build Docker image
        run: |
          docker build -t cloudstorage-backend:ci .
          docker save cloudstorage-backend:ci | gzip -1 > cloudstorage-image.tar.gz

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H -t ed25519 "$VPS_HOST" >> ~/.ssh/known_hosts

          scp -o BatchMode=yes cloudstorage-image.tar.gz \
            "root@$VPS_HOST:/tmp/cloudstorage-image.tar.gz"

          ssh -o BatchMode=yes "root@$VPS_HOST" "
            set -e
            cd /opt/cloudstorage
            git fetch origin main
            git reset --hard '$COMMIT_SHA'
            docker load -i /tmp/cloudstorage-image.tar.gz
            docker compose -f compose.prod.yaml up -d
            rm -f /tmp/cloudstorage-image.tar.gz
            docker compose -f compose.prod.yaml ps
          "
